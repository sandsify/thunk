services:
  play-haskell:
    build: .
    privileged: true
    ports:
      - "127.0.0.1:${PORT:-8123}:8123"   # PORT=... for another port
    volumes:
      - builders:/opt/play-haskell/play-haskell-worker/bwrap-files/builders
      - builderprojs:/opt/play-haskell/play-haskell-worker/bwrap-files/builderprojs
      - state:/var/lib/play-haskell

volumes:
  builders:
  builderprojs:
  state:
